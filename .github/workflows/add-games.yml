name: Add Free Casino games
on:
  push:
    paths:
      - '.github/workflows/add-games.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          nav='<button data-g="roulette">🎡 ルーレット</button><button data-g="horses">🏇 競馬</button>'
          marker='<button data-g="bank">🏦 銀行</button>'
          if 'data-g="roulette"' not in s:
              s=s.replace(marker, marker+nav)
          roulette='''<section id="roulette" class="game"><h2>🎡 ルーレット</h2><div class="bet"><div class="bet-field"><label class="bet-label">ベット額</label><input id="rb" class="input" type="number" min="1" value="10"></div><button id="rouletteSpin" class="action">回す</button></div><div class="bet"><div class="bet-field"><label class="bet-label">ベット方法</label><select id="rouletteType" class="input"><option value="number">数字（35倍）</option><option value="color">赤 / 黒（2倍）</option><option value="parity">奇数 / 偶数（2倍）</option></select></div><div id="rouletteChoiceWrap" class="bet-field"><label class="bet-label">数字</label><select id="rouletteChoice" class="input">'''+''.join(f'<option>{i}</option>' for i in range(37))+'''</select></div></div><div class="bet-help">0〜36のヨーロピアンルーレット</div><div id="rouletteResult" class="result">準備完了</div></section>'''
          horses='''<section id="horses" class="game"><h2>🏇 競馬</h2><div class="bet"><div class="bet-field"><label class="bet-label">ベット額</label><input id="horseBet" class="input" type="number" min="1" value="10"></div><button id="raceStart" class="action">レース開始</button></div><div class="bet-field"><label class="bet-label">応援する馬</label><select id="horseChoice" class="input">'''+''.join(f'<option value="{i}">{i}番 {x}</option>' for i,x in enumerate(['🦄','🐎','🏇','🐴','🦓','🐫'],1))+'''</select></div><div class="small">6頭立て / 1着的中で配当6倍</div><div id="horseTrack" style="margin-top:16px">'''+''.join(f'<div class="horse-lane" style="position:relative;height:42px;margin:6px 0;border:1px solid #00eaff33;border-radius:10px;background:#080f1d;overflow:hidden"><span style="position:absolute;left:8px;top:11px;font-size:11px">{i}</span><span class="horse-runner" style="position:absolute;left:24px;top:5px;font-size:25px;transition:left .1s">{x}</span></div>' for i,x in enumerate(['🦄','🐎','🏇','🐴','🦓','🐫'],1))+'''</div><div id="raceResult" class="result">出走馬を選んでください</div></section>'''
          if 'id="roulette"' not in s:
              s=s.replace('<section id="slot"', roulette+'\n'+horses+'\n<section id="slot"')
          s=s.replace('Version v1.0.0','Version v1.1.0')
          s=s.replace('<script src="js/casino.js?v=1.0.0"></script>','<script src="js/casino.js?v=1.0.0"></script><script src="js/new-games.js?v=1.1.0"></script>')
          p.write_text(s)
          v=Path('VERSION.json')
          import json
          d=json.loads(v.read_text())
          d['version']='v1.1.0'; d['updated']='2026-09-03'; d['changes']=['競馬ゲームを追加','ルーレットゲームを追加','ゲーム追加に伴うUI・ナビゲーションを更新']+d.get('changes',[])
          v.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION.json
          git diff --cached --quiet || git commit -m 'feat: add roulette and horse racing UI'
          git push
